<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/img/icono_hospital.png">
    <title>Hospital Reyes - Contacto</title>
</head>

<body>
    <header>
        <h2 style="text-align: center; color:dodgerblue ; font-size: 50px;">HOSPITAL REYES</h2>
        <p style="text-align: center; font-size: 20px;">Tu salud nos importa</p>
    </header>
    <hr>
    <nav>
        <a href="/index.html">Home</a>
        <a href="https://www.hospitalmetropolitano.org/es/inicio" target="_blank">Página Oficial</a>
        <a href="/contacto.html">Contacto</a>
    </nav>
    <hr>
    <!--Formulario de registro-->
    <form action="#">

        <label for="nombre">Ingrese su nombre</label>
        <br>
        <input type="text" id="nombre" placeholder="Nombre" size="10" required>
        <br><br>

        <label for="email">Ingrese su email</label>
        <br>
        <input type="email" id="email" placeholder="Email" required>
        <br><br>

        <label for="passw">Ingrese su contraseña</label>
        <br>
        <input type="password" id="passw" placeholder="Contraseña" required>
        <br><br>

        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <br>
        <input type="date" id="fecha_nacimiento" required>
        <br><br>

        <label for="cargas_familiares">Cargas familiares</label>
        <br>
        <input type="number" id="cargas_familiares">
        <br><br>

        <label for="#">Género</label>
        <br>
        <label for="masculino">
            <input type="radio" id="masculino" name="genero">Masculino
        </label>
        <label for="femenino">
            <input type="radio" id="femenino" name="genero">Femenino
        </label>
        <label for="otro">
            <input type="radio" id="otro" name="genero">Otro
        </label>
        <br><br>

        <label for="#">Seleccione su Ciudad: </label>
        <select name="ciudad" id="ciudad">
            <option value="opcion" disabled selected>Seleccionar opción</option>
            <option value="quito">Quito</option>
            <option value="cuenca">Cuenca</option>
            <option value="latacunga">Latacunga</option>
            <option value="ibarra">Ibarra</option>
        </select>
        </label>
        <br><br>

        <label for="foto">Seleccione su Foto: </label>
        <br>
        <input type="file" id="foto">
        <br><br>

        <label for="comentarios">Deje sus Comentarios:</label>
        <br>
        <textarea name="Comentarios" id="comentarios" cols="30" rows="5" placeholder="Escriba sus comentarios"></textarea>
        <br><br>

        <label for="telefono">Teléfono de contacto:</label>
        <br>
        <input type="tel" id="telefono" name="telefono" placeholder="0991234567" size="10" required>
        <br><br>
    
        <label for="hora_consulta">Hora de la consulta:</label>
        <br>
        <input type="time" id="hora_consulta" name="hora_consulta" required>
        <br><br>

        <label>Enfermedades o alergias:</label>
        <br>
        <label for="diabetes">
            <input type="checkbox" id="diabetes" name="antecedentes" value="diabetes"> Diabetes
        </label>
        <label for="hipertension">
            <input type="checkbox" id="hipertension" name="antecedentes" value="hipertension"> Hipertensión
        </label>
        <label for="asma">
            <input type="checkbox" id="asma" name="antecedentes" value="asma"> Asma
        </label>
        <label for="alergias">
            <input type="checkbox" id="alergias" name="antecedentes" value="alergias"> Alergia a medicamentos
        </label>
        <label for="ninguno">
            <input type="checkbox" id="ninguno" name="antecedentes" value="ninguno"> Ninguno
        </label>
        <br><br>

        <label for="nivel_dolor">Nivel de dolor actual:</label>
        <br>
        <input type="range" id="nivel_dolor" name="nivel_dolor" min="1" max="10">
        <br><br>

        <label for="tipo_sangre">Tipo de sangre:</label>
        <br>
        <input list="grupos_sanguineos" id="tipo_sangre" name="tipo_sangre" placeholder="Ej. O+" required>
        <datalist id="grupos_sanguineos">
            <option value="O+">
            <option value="O-">
            <option value="A+">
            <option value="A-">
            <option value="B+">
            <option value="B-">
            <option value="AB+">
            <option value="AB-">
        </datalist>
        <br><br>

        <label for="ultimo_chequeo">Último chequeo:</label>
        <br>
        <input type="datetime-local" id="ultimo_chequeo" name="ultimo_chequeo" required>
        <br><br>

        <!--Botones | button = botón simple, sin funcionalidad | submit = envía datos (DB) | reset = limpia el formulario-->

        <button>Botón simple</button>
        <input type="submit" value="Enviar">
        <button type="reset">Limpiar</button>
    </form>
</body>

</html>
